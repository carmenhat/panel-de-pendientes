<title>Panel de pendientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mesa de trabajo: cabecera con tres contadores que filtran, bandeja unificada a la izquierda y agenda del día a la derecha */
/* Paleta: fondo verde claro, tarjetas blancas, acento verde oscuro, seleccionado en lima */
:root {
  --bg: #cfe4c5;
  --surface: #ffffff;
  --ink: #1b2a1d;
  --muted: #4a5a4c;
  --faint: #7f907f;
  --line: #b7cfac;
  --accent: #3d6740;
  --accent-soft: #d8fa83;
  --accent-ink: #ffffff;
  --wait: #8a5600;
  --wait-bg: #fbeed3;
  --ok: #1f7a3a;
  --ok-bg: #e2f1e6;
  --crit: #b3261e;
  --crit-bg: #fbe3e1;
  --chip: #eaf3e4;
  --read: #3d6740;
  --read-bg: #cfe4c5;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121c13; --surface: #1a281c; --ink: #e4eee1; --muted: #a2b59f; --faint: #6c7f6a; --line: #2c3f2d;
    --accent: #51ca6b; --accent-soft: #2c4a1f; --accent-ink: #0d1a0f;
    --wait: #f0c262; --wait-bg: #3a2c10; --ok: #80d396; --ok-bg: #173322; --crit: #f2948c; --crit-bg: #3d1a18; --chip: #223524; --read: #cfe4c5; --read-bg: #24402a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121c13; --surface: #1a281c; --ink: #e4eee1; --muted: #a2b59f; --faint: #6c7f6a; --line: #2c3f2d;
  --accent: #51ca6b; --accent-soft: #2c4a1f; --accent-ink: #0d1a0f;
  --wait: #f0c262; --wait-bg: #3a2c10; --ok: #80d396; --ok-bg: #173322; --crit: #f2948c; --crit-bg: #3d1a18; --chip: #223524; --read: #cfe4c5; --read-bg: #24402a;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 1.55rem; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.meta { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.78rem; color: var(--muted); }
button, select { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 13px; cursor: pointer; font-weight: 500; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.55; cursor: progress; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 500; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.bar .id { display: grid; gap: 2px; }
.bar-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.health { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; max-width: 100%; }
.health:hover { border-color: var(--accent); }
.health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.health[data-s="ok"] .dot { background: var(--ok); }
.health[data-s="warn"] .dot { background: var(--wait); }
.health[data-s="warn"] { color: var(--wait); }
.health[data-s="err"] .dot { background: var(--crit); }
.health[data-s="err"] { color: var(--crit); border-color: var(--crit); }
.health #health-text { overflow-wrap: anywhere; }

.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.quick a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
.quick a:hover { border-color: var(--accent); }
.quick .kind { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.quick .empty-quick { font-size: 0.85rem; color: var(--muted); }

.notice { border-radius: 6px; padding: 9px 14px; font-size: 0.88rem; background: var(--crit-bg); color: var(--crit); }
.notice.info { background: var(--chip); color: var(--ink); }
.notice.warn { background: var(--wait-bg); color: var(--wait); }

.counters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.counter { text-align: left; display: grid; gap: 2px; padding: 14px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.counter .n { font-size: 2rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.counter .l { font-weight: 500; }
.counter .s { font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono); }
.counter[data-k="espera"] .n { color: var(--wait); }
.counter[data-k="leer"] .n { color: var(--read); }
.counter[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { display: grid; gap: 12px; min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.sec-head .spacer { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 999px; padding: 3px 11px; font-size: 0.82rem; background: var(--chip); border: 1px solid transparent; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .c { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); margin-left: 4px; }

.sources { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.src { display: inline-flex; gap: 6px; align-items: center; }
.src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.src[data-s="ok"]::before { background: var(--ok); }
.src[data-s="run"]::before { background: var(--wait); }
.src[data-s="fail"]::before { background: var(--crit); }
.src[data-s="cap"]::before { background: var(--wait); }
.src .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.src.cap .num { color: var(--wait); }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.item { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.item:last-child { border-bottom: 0; }
.item .main { min-width: 0; overflow-wrap: anywhere; }
.item .title { font-weight: 500; }
.item .title a { color: var(--ink); text-decoration: none; }
.item .title a:hover { text-decoration: underline; color: var(--accent); }
.item .sub { color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
.item .snip { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .when { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); white-space: nowrap; }
.tag { justify-self: start; font-size: 0.7rem; font-weight: 500; padding: 1px 8px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tag.espera { background: var(--wait-bg); color: var(--wait); }
.tag.mencion { background: var(--accent-soft); color: var(--accent); }
.tag.leer { background: var(--read-bg); color: var(--read); }
.tag.done { background: var(--ok-bg); color: var(--ok); }
.tag.resuelto { background: var(--ok-bg); color: var(--ok); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
button.mini { padding: 2px 10px; font-size: 0.78rem; }
.acts select { font-size: 0.8rem; padding: 2px 6px; }
.act-msg { font-size: 0.78rem; color: var(--muted); }
.group-head { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; padding: 8px 14px; background: var(--chip); border: 0; border-bottom: 1px solid var(--line); border-radius: 0; font-size: 0.82rem; font-weight: 500; color: var(--ink); }
.group-head:hover:not(:disabled) { border-color: var(--line); background: var(--accent-soft); }
.group-head .meta { font-weight: 400; }
.group-head .chev::before { content: "▸"; display: inline-block; color: var(--muted); transition: transform 0.15s; }
.group-head[aria-expanded="true"] .chev::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .group-head .chev::before { transition: none; } }
.group-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.empty { padding: 14px; color: var(--muted); font-size: 0.9rem; }

.agenda { display: grid; }
.ev { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .t { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
.ev .main { min-width: 0; overflow-wrap: anywhere; display: grid; gap: 2px; }
.ev .title a { color: var(--ink); text-decoration: none; font-weight: 500; }
.ev .title a:hover { text-decoration: underline; color: var(--accent); }
.ev .sub { font-size: 0.82rem; color: var(--muted); }
.ev.past { opacity: 0.55; }
.ev.now-line { padding: 0; border-bottom: 0; display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 0.72rem; font-family: var(--font-mono); padding-inline: 14px; }
.ev.now-line::after { content: ""; flex: 1; height: 1px; background: var(--accent); }

.notes { display: grid; gap: 12px; }
.notes-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; align-items: start; }
.note-item { display: grid; gap: 2px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; font-weight: 400; }
.note-item:last-child { border-bottom: 0; }
.note-item[aria-current="true"] { background: var(--accent-soft); }
.note-item .t { font-weight: 500; overflow-wrap: anywhere; }
.note-item .sub { font-size: 0.8rem; color: var(--muted); }
.reader { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.reader-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); }
.md { display: grid; gap: 8px; max-width: 72ch; overflow-wrap: anywhere; }
.md h3 { font-size: 1.15rem; } .md h4 { font-size: 0.95rem; margin-top: 6px; } .md h5 { font-size: 0.88rem; }
.md p, .md ul, .md ol { margin: 0; } .md ul, .md ol { padding-left: 20px; display: grid; gap: 2px; }
.md blockquote { margin: 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); display: grid; gap: 4px; }
.md code, .md pre { font-family: var(--font-mono); font-size: 0.84rem; background: var(--chip); border-radius: 4px; }
.md code { padding: 0 4px; } .md pre { padding: 8px 10px; overflow-x: auto; margin: 0; }
dialog.note-dlg { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(860px, calc(100vw - 32px)); background: var(--bg); color: var(--ink); }
dialog.note-dlg::backdrop { background: rgba(10, 20, 18, 0.45); }
.note-form { display: grid; gap: 12px; padding: 18px 20px; }
.note-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.note-grid .wide { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 0.78rem; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; color: inherit; }
.field textarea { font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.45; resize: vertical; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
@media (max-width: 860px) { .notes-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .note-grid { grid-template-columns: minmax(0, 1fr); } }
details.how { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
details.how summary { cursor: pointer; font-weight: 500; }
.how-body { display: grid; gap: 14px; margin-top: 12px; max-width: 76ch; font-size: 0.9rem; }
.how-body h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 500; }
.how-body ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.how-body code { font-family: var(--font-mono); font-size: 0.82rem; background: var(--chip); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; }

@media (max-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .counters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .counter { padding: 10px; }
  .counter .n { font-size: 1.5rem; }
  .counter .l { font-size: 0.8rem; line-height: 1.25; }
  .counter .s { display: none; }
  .item { grid-template-columns: minmax(0, 1fr) auto; }
  .item .tag { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .src[data-s="run"]::before { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
}
</style>

<div class="wrap">
  <header class="bar">
    <div class="id">
      <span class="eyebrow" id="today"></span>
      <h1>Panel de pendientes</h1>
    </div>
    <div class="bar-actions">
      <a class="health" id="health" data-s="idle" href="https://claude.ai/artifact/TU_PANEL_DE_SALUD" target="_blank" rel="noopener"><span class="dot" aria-hidden="true"></span><span id="health-text">Salud · leyendo…</span></a>
      <a class="meta" href="#notas">Notas</a>
      <span class="meta" id="freshness">Cargando…</span>
      <button class="primary" id="btn-refresh" type="button">Actualizar</button>
    </div>
  </header>

  <nav class="quick" id="quick" aria-label="Accesos rápidos"></nav>
  <div id="page-notice" hidden></div>

  <section class="counters" aria-label="Contadores">
    <button class="counter" type="button" data-k="espera" id="cnt-espera" aria-pressed="false"><span class="n" id="n-espera">–</span><span class="l">Esperan respuesta</span><span class="s" id="s-espera">&nbsp;</span></button>
    <button class="counter" type="button" data-k="mencion" id="cnt-mencion" aria-pressed="false"><span class="n" id="n-mencion">–</span><span class="l">Te mencionan</span><span class="s" id="s-mencion">&nbsp;</span></button>
    <button class="counter" type="button" data-k="leer" id="cnt-leer" aria-pressed="false"><span class="n" id="n-leer">–</span><span class="l">Para leer</span><span class="s" id="s-leer">&nbsp;</span></button>
    <button class="counter" type="button" data-k="info" id="cnt-info" aria-pressed="false"><span class="n" id="n-info">–</span><span class="l">Informativos</span><span class="s" id="s-info">&nbsp;</span></button>
  </section>

  <main class="grid">
    <section class="panel" aria-labelledby="h-inbox">
      <div class="sec-head">
        <h2 id="h-inbox">Bandeja</h2>
        <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
        <span class="spacer"></span>
        <label class="meta" for="f-source">Fuente</label>
        <select id="f-source"><option value="all">Todo</option><option value="mail">Correo</option><option value="slack">Slack</option></select>
      </div>
      <div class="sources" id="sources"></div>
      <div id="source-notices" class="panel"></div>
      <div class="list" id="inbox"><div class="empty">Leyendo correo y Slack…</div></div>
    </section>

    <aside class="panel" aria-labelledby="h-agenda">
      <div class="sec-head"><h2 id="h-agenda">Hoy</h2><span class="spacer"></span><span class="meta" id="agenda-meta"></span></div>
      <div id="agenda-notice" class="panel"></div>
      <div class="list agenda" id="agenda"><div class="empty">Leyendo la agenda…</div></div>
    </aside>
  </main>

  <section class="notes panel" id="notas" aria-labelledby="h-notas">
    <div class="sec-head">
      <h2 id="h-notas">Notas</h2>
      <span class="meta" id="notes-meta"></span>
      <span class="spacer"></span>
      <label class="meta" for="nl-estado">Estado</label>
      <select id="nl-estado"><option value="abierta">Abiertas</option><option value="cerrada">Cerradas</option><option value="">Todas</option></select>
      <input id="nl-q" type="search" placeholder="Buscar" aria-label="Buscar en las notas" style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;color:inherit;min-width:0;max-width:12rem">
      <button type="button" class="primary" id="btn-new-note">Nueva nota</button>
    </div>
    <div id="notes-notice" class="panel"></div>
    <div class="notes-grid">
      <div class="list" id="notes-list"><div class="empty">Leyendo el índice de notas…</div></div>
      <div class="reader" id="reader"><div class="empty">Elige una nota para leerla aquí.</div></div>
    </div>
  </section>

  <dialog class="note-dlg" id="note-dlg" aria-labelledby="nf-title">
    <form class="note-form" id="note-form">
      <h2 id="nf-title">Nueva nota</h2>
      <div class="note-grid">
        <div class="field"><label for="nf-concepto">Concepto</label><input id="nf-concepto" type="text" autocomplete="off"></div>
        <div class="field"><label for="nf-contexto">Contexto</label><input id="nf-contexto" type="text" autocomplete="off"></div>
        <div class="field wide"><label for="nf-nombre">Nombre del archivo</label><input id="nf-nombre" type="text" autocomplete="off"></div>
        <div class="field"><label for="nf-persona">Persona o proveedor</label><input id="nf-persona" type="text" autocomplete="off"></div>
        <div class="field"><label for="nf-estado">Estado</label><select id="nf-estado"><option value="abierta">abierta</option><option value="cerrada">cerrada</option></select></div>
        <div class="field wide"><label for="nf-asunto">Asunto</label><input id="nf-asunto" type="text" autocomplete="off"></div>
      </div>
      <p class="meta" id="nf-origen"></p>
      <div class="field"><label for="nf-body">Contenido en markdown</label><textarea id="nf-body" rows="16"></textarea></div>
      <div class="row-actions"><button type="button" class="primary" id="nf-save">Guardar nota</button><button type="button" id="nf-cancel">Cancelar</button><span class="act-msg" id="nf-msg"></span></div>
    </form>
  </dialog>

  <details class="how" id="how">
    <summary>Cómo funciona este panel</summary>
    <div class="how-body" id="how-body"></div>
  </details>
</div>

<script>
(() => {
  "use strict";

  // ---------- configuración fija ----------
  const ME_EMAIL = "tu.nombre@tuempresa.com"; // ← tu correo
  const ME_SLACK = "UXXXXXXXXXX"; // ← tu id de usuario de Slack
  const STATE_SHEET = "ID_DE_TU_HOJA_DE_ESTADO"; // ← ver plantilla_hoja_estado/
  const STATE_URL = "https://docs.google.com/spreadsheets/d/" + STATE_SHEET + "/edit";

  // Valores por defecto: los mismos que la hoja de estado. Se usan si no se puede leer.
  const DEFAULT_LIMITS = { dias: 3, correos_bandeja: 40, enviados: 50, slack_por_pagina: 20, slack_paginas: 2, minutos_validez: 5, reuniones: 100, hilos_completar: 10, conversaciones_leer: 15, ia_lote: 20, ia_lotes: 3 };
  const LIMIT_RANGE = { dias: [1, 14], correos_bandeja: [1, 50], enviados: [1, 50], slack_por_pagina: [1, 20], slack_paginas: [1, 5], minutos_validez: [1, 5], reuniones: [1, 250], hilos_completar: [0, 25], conversaciones_leer: [0, 30], ia_lote: [1, 30], ia_lotes: [0, 5] };
  const DEFAULT_RULES = [
    { nombre: "Promociones", campo: "etiqueta", patron: "CATEGORY_PROMOTIONS" },
    { nombre: "Remitentes automáticos", campo: "remitente", patron: "no-?reply" },

  // ---------- hoja de estado ----------
  function rowsToObjects(values) {

  function compile(list, kind) {

      const FIELDS = ["remitente", "asunto", "etiqueta", "slack"];
      const campo = (r.campo || "").toLowerCase();
      const campo2 = (r.campo2 || "").toLowerCase();
      const label = r.nombre || r.patron || "sin nombre";
      if (!FIELDS.includes(campo) || !r.patron) { S.cfg.notes.push(`${kind} «${label}»: falta el campo o el patrón.`); continue; }
      // Segunda condición opcional: tienen que cumplirse las dos.
      if ((campo2 || r.patron2) && (!FIELDS.includes(campo2) || !r.patron2)) { S.cfg.notes.push(`${kind} «${label}»: la segunda condición necesita campo2 y patron2; se ignora la regla.`); continue; }

  async function loadConfig(refresh) {

  // ---------- Gmail ----------

  async function loadGmail(refresh) {
    const L = S.cfg.limits;
    S.gmail = { ...S.gmail, s: "run" }; renderSources();

      const [inb, snt] = await Promise.all([
        call("Gmail", "search_threads", { query: `in:inbox newer_than:${L.dias}d`, pageSize: L.correos_bandeja, view: "THREAD_VIEW_MINIMAL" }, refresh),
        call("Gmail", "search_threads", { query: `in:sent newer_than:${L.dias}d`, pageSize: L.enviados, view: "THREAD_VIEW_MINIMAL" }, refresh),

  // ---------- Slack ----------
  function parseSlack(md) {
    if (typeof md !== "string") return [];
    return md.split(/\n### Result \d+ of \d+\n/).slice(1).map((b) => {
      const g = (re) => ((b.match(re) || [])[1] || "").trim();
      const fromRaw = g(/^From:\s*(.+)$/m);
      const chanRaw = g(/^Channel:\s*(.+)$/m);
      return {
        chanId: (chanRaw.match(/\(ID:\s*([A-Z0-9]+)\)/) || [])[1] || chanRaw,
        chanName: chanRaw.replace(/\s*\(ID:[^)]*\)/, ""),
        participants: g(/^Participants:\s*(.+)$/m).replace(/\s*\(ID:[^)]*\)/g, ""),
        participantIds: [...g(/^Participants:\s*(.+)$/m).matchAll(/\(ID:\s*([A-Z0-9]+)\)/g)].map((x) => x[1]),
        fromEmail: ((fromRaw.match(/<([^>]+)>/) || [])[1] || "").toLowerCase(),
        fromId: (fromRaw.match(/\(ID:\s*([A-Z0-9]+)\)/) || [])[1] || "",

        text: (b.split(/^Text:\s*$/m)[1] || "").replace(/\n---\s*$/, "").trim(),

    });
  }
  async function slackSearch(args, refresh) {
    const L = S.cfg.limits;
    const all = []; let cursor = null, more = false, at = Date.now();
    for (let p = 0; p < L.slack_paginas; p++) {
      const res = await call("Slack", "slack_search_public_and_private", { ...args, limit: L.slack_por_pagina, include_context: false, sort: "timestamp", ...(cursor ? { cursor } : {}) }, refresh);
      at = Math.min(at, storedAt(res));
      const pl = payloadOf(res);
      const items = parseSlack(pl.results);
      all.push(...items);
      cursor = ((pl.pagination_info || "").match(/cursor\s+`([^`]+)`/) || [])[1] || null;
      if (!cursor || items.length < L.slack_por_pagina) { more = false; break; }
      more = true;
    }
    const seen = new Set();
    const items = all.filter((m) => { const k = m.chanId + "|" + m.ts; if (seen.has(k)) return false; seen.add(k); return true; });
    return { items, read: all.length, max: L.slack_por_pagina * L.slack_paginas, more, at };
  }
  function sinceDate() { const d = new Date(); d.setDate(d.getDate() - S.cfg.limits.dias); return ymd(d); }
  const emailOf = (x) => { const m = String(x || "").match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/); return m ? m[0].toLowerCase() : ""; };

  // Últimas líneas de una conversación: «Nombre <correo>: texto [AAAA-MM-DD HH:MM:SS CEST]», la más reciente primero.
  function parseChannel(text) {
    if (typeof text !== "string") return [];
    const re = /(^|\n)([^\n<]{1,80}?) <([^>\s]+@[^>\s]+)>: /g; const heads = []; let m;
    while ((m = re.exec(text))) heads.push({ idx: m.index + m[1].length, end: re.lastIndex, email: m[3].toLowerCase() });

      const body = text.slice(h.end, i + 1 < heads.length ? heads[i + 1].idx : text.length);
      const t = body.match(/\[(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d) (CEST|CET|UTC|GMT)\]/);

  async function loadDm(refresh) {
    const L = S.cfg.limits;
    S.dm = { ...S.dm, s: "run" }; renderSources();
    try {
      const r = await slackSearch({ filters: `to:me after:${sinceDate()}`, channel_types: "im,mpim" }, refresh);
      learnIds(r.items);
      const byChan = new Map();
      for (const m of r.items) {
        if (m.fromId === ME_SLACK) continue;
        const c = byChan.get(m.chanId) || { msgs: [], last: m };

      const targets = convs.slice(0, L.conversaciones_leer);

        const batch = targets.slice(i, i + 3);
        const got = await Promise.allSettled(batch.map((c) => call("Slack", "slack_read_channel", { channel_id: c.last.chanId, limit: 15, response_format: "concise" }, refresh)));

          c.read = true;
          c.myLast = msgs.filter((x) => x.email === ME_EMAIL).reduce((mx, x) => Math.max(mx, x.ts), 0);

    return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour === 24 ? 0 : +p.hour, +p.minute, +p.second) - fechaAprox.getTime()) / 60000;

        if (para.length || quoteBuf.length) { flush(); }
        if (!list || list.tagName !== (ordered ? "OL" : "UL")) { if (list) root.append(list); list = el(ordered ? "ol" : "ul"); }
        if (m[1].trim()) list.append(el("li", null, inline(m[1].replace(/^\[( |x)\]\s*/i, (x) => (/x/i.test(x) ? "☑ " : "☐ ")))));
        continue;
      }
      if (list || quoteBuf.length) flush();
      para.push(line.trim());
    }
    if (code !== null) root.append(el("pre", null, el("code", { text: code.join("\n") })));
    flush();
    return root;
  }

  async function loadNotes(refresh) {
    S.notes.s = "run"; renderNotes();
    try {
      const res = await call("Google Sheets", "get_values", { spreadsheetId: NOTES_SHEET, range: "notas!A:J" }, refresh);
      const vals = payloadOf(res).values || [];
      const head = (vals[0] || []).map((h) => String(h || "").trim().toLowerCase());
      S.notes.rows = vals.slice(1).map((r, i) => ({ row: i + 2, ...Object.fromEntries(head.map((h, k) => [h, String(r[k] == null ? "" : r[k]).trim()])) }))
        .filter((n) => n.archivo_id).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
      S.notes.s = "ok";
    } catch (e) { S.notes.s = "fail"; S.notes.err = errText(e); }
    renderNotes();
  }
  async function openReader(n) {
    S.notes.sel = n.archivo_id; renderNotes();
  }
  function renderNotes() {
    const N = S.notes, list = $("notes-list"), reader = $("reader"), nb = $("notes-notice");
    nb.replaceChildren();
    if (N.s === "fail") { const b = el("button", { type: "button", class: "link", text: "Reintentar" }); b.addEventListener("click", () => loadNotes(true)); nb.append(notice(`No se pudo leer el índice de notas. ${N.err}`, null, b)); }
    const estado = $("nl-estado").value, q = $("nl-q").value.trim().toLowerCase();
    const rows = N.rows.filter((n) => (!estado || (n.estado || "abierta") === estado) && (!q || [n.concepto, n.contexto, n.persona, n.asunto, n.resumen].join(" ").toLowerCase().includes(q)));
    $("notes-meta").textContent = N.s === "ok" ? `${rows.length} de ${N.rows.length}` : N.s === "run" ? "leyendo…" : "";
    list.replaceChildren();
    if (!rows.length) list.append(el("div", { class: "empty" }, N.s === "run" ? "Leyendo el índice de notas…" : N.rows.length ? "Ninguna nota coincide con el filtro." : ["Todavía no hay notas. Crea una con «Nota» en cualquier elemento de la bandeja o con «Nueva nota». Índice: ", el("a", { href: NOTES_SHEET_URL, target: "_blank", rel: "noopener", text: "notas_indice" }), "."]));
    for (const n of rows) {
      const b = el("button", { type: "button", class: "note-item", "aria-current": String(N.sel === n.archivo_id) },
        el("span", { class: "t", text: [n.concepto, n.contexto].filter(Boolean).join(" · ") || n.asunto || "(sin título)" }),
        el("span", { class: "sub", text: [n.fecha, n.persona, n.estado || "abierta"].filter(Boolean).join(" · ") }));
      b.addEventListener("click", () => openReader(n));
      list.append(b);
    }
    const sel = N.rows.find((n) => n.archivo_id === N.sel);
    reader.replaceChildren();
    if (!sel) { reader.append(el("div", { class: "empty", text: "Elige una nota para leerla aquí." })); return; }
    const cached = N.cache.get(sel.archivo_id);
    if (!cached) {
      reader.append(el("div", { class: "empty", text: "Abriendo la nota…" }));
      S.mcp.callTool("Google Drive", "download_file_content", { fileId: sel.archivo_id }, cacheOpts(false))
        .then((res) => { const p = payloadOf(res); N.cache.set(sel.archivo_id, { text: decodeB64(p.content), title: p.title || "" }); if (S.notes.sel === sel.archivo_id) renderNotes(); })
        .catch((e) => { if (S.notes.sel === sel.archivo_id) { reader.replaceChildren(notice(`No se pudo abrir la nota. ${errText(e)}`)); } });
      return;
    }
    sel.title = cached.title || `${sel.concepto}.md`;
    const { meta, body } = parseFrontMatter(cached.text);
    const est = meta.estado || sel.estado || "abierta";
    const acts = el("div", { class: "row-actions" });
    const edit = el("button", { type: "button", class: "mini", text: "Editar" }); edit.addEventListener("click", () => openEditNote(sel, cached.text));
    const toggle = el("button", { type: "button", class: "mini", text: est === "cerrada" ? "Reabrir" : "Cerrar nota" }); toggle.addEventListener("click", () => openEditNote(sel, cached.text, est === "cerrada" ? "abierta" : "cerrada"));
    acts.append(edit, toggle);
    if (safeUrl(sel.nota)) acts.append(el("a", { class: "meta", href: safeUrl(sel.nota), target: "_blank", rel: "noopener", text: "Ver en Drive" }));
    if (safeUrl(meta.origen || sel.origen)) acts.append(el("a", { class: "meta", href: safeUrl(meta.origen || sel.origen), target: "_blank", rel: "noopener", text: "Abrir origen" }));
    reader.append(
      el("div", { class: "reader-meta" }, el("span", { text: `Fecha: ${meta.fecha || sel.fecha}` }), el("span", { text: `Persona: ${meta.persona || sel.persona || "—"}` }), el("span", { class: "tag " + (est === "cerrada" ? "done" : "espera"), text: est })),
      acts, renderMd(body));
  }
  $("nl-estado").addEventListener("change", renderNotes);
  $("nl-q").addEventListener("input", renderNotes);
  $("btn-new-note").addEventListener("click", openNewNote);
  $("note-form").addEventListener("submit", (e) => e.preventDefault());
  $("nf-save").addEventListener("click", saveNote);
  $("nf-cancel").addEventListener("click", () => { $("nf-cancel").textContent = "Cancelar"; $("note-dlg").close(); S.draft = null; });
  $("note-dlg").addEventListener("close", () => { $("nf-cancel").textContent = "Cancelar"; });
  for (const id of ["nf-concepto", "nf-contexto"]) $(id).addEventListener("input", () => { if (S.draft && S.draft.mode === "new" && !S.draft.nameTouched) $("nf-nombre").value = autoName(); });
  $("nf-nombre").addEventListener("input", () => { if (S.draft) S.draft.nameTouched = true; });

  // ---------- carga ----------
  async function loadAll(refresh) {
    if (!S.mcp || S.loading) return;
    S.loading = true; renderFreshness();
    await loadConfig(refresh);
    renderQuick(); renderHow();
    await Promise.all([loadGmail(refresh), loadDm(refresh), loadMen(refresh), loadMine(refresh), loadCal(refresh), loadNotes(refresh), loadHealth(refresh)]);
    S.loading = false; S.lastLoad = Date.now(); renderAll();
    classify();
  }

  $("btn-refresh").addEventListener("click", () => loadAll(true));
  $("f-source").addEventListener("change", (e) => { S.source = e.target.value; renderChips(); renderInbox(); });
  for (const k of ["espera", "mencion", "leer", "info"]) $("cnt-" + k).addEventListener("click", () => setFilter(S.filter === k ? "pend" : k));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && S.lastLoad && Date.now() - S.lastLoad > S.cfg.limits.minutos_validez * 60000) loadAll(false);
  });

  const today = new Date();
  $("today").textContent = today.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  S.cfg.rules = compile(DEFAULT_RULES, "Regla");
  S.cfg.exceptions = compile(DEFAULT_EXCEPTIONS, "Excepción");
  renderChips(); renderSources(); renderHow();

  async function boot() {
    const c = window.claude;
    const fail = (msg) => { const b = $("page-notice"); b.hidden = false; b.replaceChildren(notice(msg)); $("btn-refresh").disabled = true; $("freshness").textContent = "Sin datos"; $("inbox").replaceChildren(el("div", { class: "empty", text: "Sin datos." })); $("agenda").replaceChildren(el("div", { class: "empty", text: "Sin agenda." })); };
    if (!c || typeof c.use !== "function") return fail("Este panel solo funciona abierto en claude.ai, con tus conectores.");
    S.mcp = await c.use("mcp").catch(() => null);
    if (!S.mcp) return fail("Esta vista no puede usar conectores. Abre el panel en claude.ai con tu cuenta del trabajo.");
    loadAll(false);
  }
  boot();
})();
</script>
